name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # The web group is what the hosted service and the API tests run on,
        # so its pins are resolved here too.
        run: uv sync --frozen --group web

      - name: Tests
        run: uv run pytest --cov=src/tstorm_climo --cov-report=term-missing

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Build
        run: uv build
