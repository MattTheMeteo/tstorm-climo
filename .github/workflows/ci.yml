name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The app group is what the hosted service runs on, so its pins
      # are resolved and type-checked here too. A broken marimo pin
      # must not reach a deploy.
      - name: Install app dependencies
        run: uv sync --frozen --group app

      - name: Tests
        run: uv run pytest --cov=src/tstorm_climo --cov-report=term-missing

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Marimo check
        run: uv run --group app marimo check app/rain_app.py

      - name: Type check
        run: uv run ty check

      - name: Build
        run: uv build
