name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        # Install the service dependencies for the backend and API tests.
        run: uv sync --frozen --group web

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Tests with library and backend coverage
        run: uv run pytest -q --cov=src/tstorm_climo --cov=apps.web.backend --cov-report=term-missing

      - name: Build Python package
        run: uv build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit
