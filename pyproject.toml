[project]
name = "tstorm-climo"
version = "0.1.0"
description = "Precipitation climatology built from HRRR analysis data"
readme = "README.md"
authors = [
    { name = "Matt Livingston", email = "mwl5399@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.112",
    "duckdb>=1.5.6",
    "dynamical-catalog>=0.8.0",
    "httpx>=0.28.1",
    "osmium>=4.3.1",
    "polars>=1.0",
    "pydantic>=2.0",
    "tzfpy>=2.1.0",
    "xarray>=2026.7.0",
]

[project.optional-dependencies]
catalog-s3 = ["boto3>=1.40.0"]

[project.scripts]
tstorm-climo = "tstorm_climo:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.86",
]

# App-only dependencies: the interactive marimo Studio page, kept out of
# the core CLI so the analysis tooling has no UI requirements.
app = [
    "marimo>=0.25.1",
    "marimo-studio>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.coverage.run]
source = ["src/tstorm_climo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
