[project]
name = "tstorm-climo"
version = "0.1.0"
description = "Precipitation climatology built from HRRR analysis data"
readme = "README.md"
authors = [
    { name = "Matt Livingston", email = "mwl5399@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "dynamical-catalog>=0.8.0",
    "httpx>=0.28.1",
    "icechunk>=2.3.1",
    "numpy>=2.0",
    "osmium>=4.3.1",
    "polars>=1.0",
    "pydantic>=2.0",
    "tzfpy>=2.1.0",
    "xarray>=2026.7.0",
]

[project.optional-dependencies]
# Only the S3 publishing path needs boto3. It is imported lazily, so the
# core CLI works without it and says so if S3 publishing is asked for.
# The dev group installs it too, so `ty` can resolve those lazy imports;
# core installs (and CI's core-only surface) still have it marked
# optional via this extra.
catalog-s3 = ["boto3>=1.43.112"]

[project.scripts]
tstorm-climo = "tstorm_climo:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.123",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.86",
    "zarr>=3.4.2",
]

# The FastAPI backend behind the web app. Kept out of the core CLI; the
# hosted service and the API tests both run against this group.
web = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts", "apps"]

[tool.coverage.run]
source = ["src/tstorm_climo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
