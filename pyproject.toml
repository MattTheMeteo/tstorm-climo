[project]
name = "tstorm-climo"
version = "0.1.0"
description = "Precipitation climatology built from HRRR analysis data"
readme = "README.md"
authors = [
    { name = "Matt Livingston", email = "mwl5399@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dynamical-catalog>=0.8.0",
    "polars>=1.0",
    "pydantic>=2.0",
    "requests>=2.34.2",
    "tzfpy>=2.1.0",
    "xarray>=2026.7.0",
]

[project.scripts]
tstorm-climo = "tstorm_climo:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

